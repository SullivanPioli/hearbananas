---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up env
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PLATFORM=linux-arm64" >> $GITHUB_ENV
      - name: Install OS packages
        run: |
          sudo apt-get install -y flatpak flatpak-builder && \
          sudo snap install snapcraft --classic && \
          flatpak remote-add \
          --user \
          --if-not-exists \
          flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: linux-arm64-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            linux-arm64-bun-${{ hashFiles('**/bun.lockb') }}
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron/
          key: linux-arm64-electron-${{ hashFiles('~/.cache/electron/**') }}
          restore-keys: |
            linux-arm64-electron-${{ hashFiles('~/.cache/electron/**') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Linux ARM64
        run: ./scripts/build.sh
      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            dist/bananas_arm64.deb
            dist/bananas_arm64.AppImage
            dist/bananas_aarch64.flatpak
          if-no-files-found: error
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up env
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PLATFORM=linux" >> $GITHUB_ENV
      - name: Install OS packages
        run: |
          sudo apt-get install -y flatpak flatpak-builder && \
          sudo snap install snapcraft --classic && \
          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: linux-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            linux-bun-${{ hashFiles('**/bun.lockb') }}
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron/
          key: linux-electron-${{ hashFiles('~/.cache/electron/**') }}
          restore-keys: |
            linux-electron-${{ hashFiles('~/.cache/electron/**') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Linux
        run: ./scripts/build.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/bananas_amd64.deb
            dist/bananas_amd64.snap
            dist/bananas_x86_64.AppImage
            dist/bananas_x86_64.flatpak
          if-no-files-found: error
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up env
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PLATFORM=windows" >> $GITHUB_ENV
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: windows-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            windows-bun-${{ hashFiles('**/bun.lockb') }}
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache/
          key: windows-electron-${{ hashFiles('~/AppData/Local/electron/Cache/**') }}
          restore-keys: |
            windows-electron-${{ hashFiles('~/AppData/Local/electron/Cache/**') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Windows
        shell: bash
        run: ./scripts/build.sh
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/bananas-setup_x64.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs:
      - build-linux
      - build-linux-arm64
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
